    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    </head>
    <body>
        <h1 class="text-danger   text-center">SIGNUP FORM  </h1>
        <h1>
            <form>
                <div class="mb-5">
                <label class="form-label" for="name">Name:</label>
                <input class="form-control" type="text" name="name" id="name">
                </div>
                <div class="mb-5">
                <label class="form-label" for="usn">usn:</label>
                <input class="form-control"  type="text" name="usn" id="usn">
                </div>
                <div class="mb-5">
                <label class="form-label" for="email_id">Email id:</label>
                <input  class="form-control" type="email" name="email_id" id="email_id">
                </div>
                <div class="mb-5">
                <label class="form-label"  for="password">password:</label>
                <input class="form-control" type="password" name="password" id="password">
                </div>
                <div class="mb-5">
                <label for="form-label">gender:</label>
                    <input  type="radio" name="gender" id="male" value="male">
                    <label   for="male">male</label>
                    <input  type="radio" name="gender" id="female" value="female">
                    <label for="female">Female</label>
            
                </div>
                <div class="mb-5">
                    <label   for="form-label">languages:</label>
                    <input class="form-check-input" type="checkbox" name="language1" id="kannada" value="kannada">
                    <label  class="form-check-label" for="kannada">kannada</label>
                    <input class="form-check-input" type="checkbox" name="language2" id="tamil" value="tamil">
                    <label class="form-check-label" for="tamil">tamil</label>
                    <input class="form-check-input" type="checkbox" name="language3" id="telugu" value="telugu">
                    <label class="form-check-label" for="telugu">telugu</label>
                    <input class="form-check-input" type="checkbox" name="language4" id="hindi" value="hindi">
                    <label class="form-check-label" for="hindi">hindi</label>
                </div>
                <div class="mb-5">
                <label class="form-label    " for="branch">branch:</label>
                <select class="form-select" name="branch" id="branch">
                    <option value="cse">CSE</option>
                    <option value="ise">ISE</option>
                    <option value="ece">ECE</option>
                    <option value="AIML">AIML</option>
                </select>
                </div>
                <input class="btn btn-outline-danger" type="reset" value="cancel">
                <input class="btn btn-outline-success" type="submit" value="Signup">
            </form>
        </h1>
        <script src="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>

    </body>
    </html>
